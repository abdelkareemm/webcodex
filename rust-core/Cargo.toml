[package]
name = "webcodex-core"
version = "1.3.0"
edition = "2021"
authors = ["abdelkareemm"]
license = "Apache-2.0"
description = "WebCodex native local operations worker"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
ignore = "0.4"
sha1 = "0.10"

crossterm = "0.28"
