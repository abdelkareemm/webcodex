name: WebCodex Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate tag and versions
        shell: pwsh
        run: |
          @'
          import os
          import tomllib
          from pathlib import Path
          paths = [
              ("pyproject.toml", "project"),
              ("rust-core/Cargo.toml", "package"),
              ("rust-tui/Cargo.toml", "package"),
          ]
          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          for path, section in paths:
              version = tomllib.loads(Path(path).read_text(encoding="utf-8"))[section]["version"]
              if version != expected:
                  raise SystemExit(f"{path}: {version} != {expected}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Version mismatch' }

      - name: Install Python dependencies
        run: python -m pip install -e .

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Test and build Rust
        shell: pwsh
        run: |
          cargo test --locked --manifest-path rust-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
          cargo test --locked --manifest-path rust-tui/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'TUI tests failed' }
          cargo build --locked --release --manifest-path rust-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Core build failed' }
          cargo build --locked --release --manifest-path rust-tui/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'TUI build failed' }

      - name: Assemble release ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'webcodex-stage'
          $sourceZip = Join-Path $env:RUNNER_TEMP 'source.zip'
          git archive --format=zip --output=$sourceZip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Expand-Archive $sourceZip -DestinationPath $stage
          $core = Join-Path $stage 'rust-core\target\release'
          $tui = Join-Path $stage 'rust-tui\target\release'
          New-Item -ItemType Directory -Force -Path $core, $tui | Out-Null
          Copy-Item 'rust-core\target\release\webcodex-native.exe' $core
          Copy-Item 'rust-core\target\release\webcodex-core.exe' $core
          Copy-Item 'rust-tui\target\release\webcodex-tui.exe' $core
          Copy-Item 'rust-tui\target\release\webcodex-tui.exe' $tui
          $zip = "webcodex-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw 'Release archive missing' }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: webcodex-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
